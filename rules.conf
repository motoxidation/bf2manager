# name substrings (case insensitive) get kicked
#kick admin
#kick [bot]

# ips get banned
#banip 1.2.3.4

# seconds between announcements, then the text
announce 600 welcome, no teamkilling pls

# force next map after this many seconds (0/off = never)
#maptime 3600

# seconds between player polls
interval 5

# team balance + no fly zones need the shim (shim/bf2am_shim.py) running in the
# server, it writes the state file and applies the actions file
#state /path/to/bf2/state.txt
#actions /path/to/bf2/actions.txt
# balance <player diff> <cooldown secs>
#balance 2 60
# nfz <x> <z> <radius>, aircraft get warned twice then killed
#nfz 0 0 150
